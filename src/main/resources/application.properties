spring.application.name=Vignettes
spring.jpa.open-in-view=false
###
# Database: PostgreSQL everywhere (local, tests, Supabase). The connection itself
# comes from a profile (dev / prod) or, in tests, from Testcontainers.
# The schema has ONE owner: Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match it.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# `pgdev` was the PostgreSQL dev profile before H2 was removed; it is now `dev`.
spring.profiles.group.pgdev=dev
###
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs/openapi
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tagsSorter=alpha
###
app.jwt.secret=${APP_JWT_SECRET}
app.storage.root=${APP_STORAGE_ROOT:./data/storage}
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:false}
app.glottolog.frequency-days-min=${APP_GLOTTOLOG_FREQUENCY_DAYS_MIN:1}
app.glottolog.frequency-days-max=${APP_GLOTTOLOG_FREQUENCY_DAYS_MAX:365}
app.glottolog.python-executable=${APP_GLOTTOLOG_PYTHON:python3}
app.glottolog.version=${APP_GLOTTOLOG_VERSION:5.3}
###
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB