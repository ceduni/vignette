spring.application.name=Vignettes
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS COMMUNITY
spring.jpa.hibernate.ddl-auto=create-drop
###
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs/openapi
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tagsSorter=alpha
###
app.jwt.secret=${APP_JWT_SECRET}
app.storage.root=${APP_STORAGE_ROOT:./data/storage}
app.glottolog.update-enabled=${APP_GLOTTOLOG_UPDATE_ENABLED:true}
app.glottolog.legacy-pipeline-enabled=${APP_GLOTTOLOG_LEGACY_PIPELINE:false}
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:false}
app.glottolog.frequency-days-min=${APP_GLOTTOLOG_FREQUENCY_DAYS_MIN:1}
app.glottolog.frequency-days-max=${APP_GLOTTOLOG_FREQUENCY_DAYS_MAX:365}
app.glottolog.python-executable=${APP_GLOTTOLOG_PYTHON:python3}
app.glottolog.script-path=${APP_GLOTTOLOG_SCRIPT:scripts/download_glottolog_languoid.py}
app.glottolog.cache-dir=${APP_GLOTTOLOG_CACHE_DIR:./data/glottolog-cache}
app.glottolog.output-csv=${APP_GLOTTOLOG_OUTPUT_CSV:./data/glottolog/languoid.csv}
app.glottolog.version=${APP_GLOTTOLOG_VERSION:5.3}
###
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB