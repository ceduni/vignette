server.port=${PORT:8081}
#
# PostgreSQL (Supabase or any other host). For Supabase use the *session* pooler
# (port 5432), e.g.
#   DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<project-ref>
# The transaction pooler (port 6543) breaks JDBC prepared statements and LISTEN/NOTIFY.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#
# Kept small: Supabase poolers cap the number of client connections, and the
# Python Glottolog worker holds two more.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
#
# An empty database is built by Flyway from V1. A database that already has tables
# but no Flyway history is refused unless FLYWAY_BASELINE_ON_MIGRATE=true is set
# for that one start (see "Database schema" in the README).
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
#
server.error.path=/error2
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:false}
