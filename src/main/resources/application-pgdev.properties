# Local PostgreSQL profile (shared with the Python Glottolog worker).
# Override with env if needed: SPRING_DATASOURCE_URL, DB_PASSWORD, PGPORT, etc.
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:${PGPORT:5432}/vignette
spring.datasource.username=${PGUSER:vignette}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false

server.error.path=/error2
app.glottolog.legacy-pipeline-enabled=false
# Empty catalogue at boot → Java runs: python3 -m glottolog_worker --bootstrap
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:true}
app.glottolog.update-enabled=false
app.bootstrap.admin.enabled=true
app.bootstrap.admin.username=admin
app.bootstrap.admin.email=admin@local.dev
app.bootstrap.admin.password=admin12345
