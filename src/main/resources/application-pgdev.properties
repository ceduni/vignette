# Local PostgreSQL profile (shared with the Python Glottolog worker).
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/vignette
spring.datasource.username=vignette
spring.datasource.password=${DB_PASSWORD:vignette_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.path=/error2
app.glottolog.legacy-pipeline-enabled=false
app.glottolog.bootstrap-import-enabled=false
app.glottolog.update-enabled=false
app.bootstrap.admin.enabled=true
app.bootstrap.admin.username=admin
app.bootstrap.admin.email=admin@local.dev
app.bootstrap.admin.password=admin12345
