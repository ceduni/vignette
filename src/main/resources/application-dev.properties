# Local development profile: PostgreSQL on localhost, shared with the Python Glottolog worker.
# (`pgdev` is kept as an alias of this profile, see application.properties.)
# Override with env if needed: SPRING_DATASOURCE_URL, PGPORT, PGUSER, DB_PASSWORD.
server.port=8081
#
spring.datasource.url=jdbc:postgresql://localhost:${PGPORT:5432}/vignette
spring.datasource.username=${PGUSER:vignette}
spring.datasource.password=${DB_PASSWORD:}
#
# Local databases created before Flyway owned the schema (Hibernate ddl-auto=update)
# have tables but no flyway_schema_history: mark them as "at V1" instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
#
server.error.path=/error2
# Empty catalogue at boot -> Java runs: python3 -m glottolog_worker --bootstrap
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:true}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
