server.port=8081
#
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/bootapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS community
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.locations=classpath:db/migration
# Enable batch inserts
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
#spring.jpa.open-in-view=false
spring.data.web.pageable.serialization-mode=via_dto
# Show SQL for debugging (optional, remove in production)
# spring.jpa.show-sql=true
server.error.path=/error2
# Legacy Java ProcessBuilder/CSV import/scheduler (keep false unless debugging old path).
app.glottolog.legacy-pipeline-enabled=${APP_GLOTTOLOG_LEGACY_PIPELINE:false}
app.glottolog.bootstrap-import-enabled=${APP_GLOTTOLOG_BOOTSTRAP_IMPORT:false}
app.glottolog.update-enabled=true
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
